  /* ---- greeter top bar ---- */
  .kq-instance .greeter-bar { position:absolute; top:0; left:0; right:0; height:28px; z-index:950;
    display:flex; align-items:center; justify-content:flex-end; padding:0 14px; color:#fff; font-size:12.5px; }
  .kq-instance .gb-left { font-weight:600; }
  .kq-instance .gb-right { display:flex; align-items:center; gap:16px; }
  .kq-instance .gb-icon { background:none; border:none; color:#fff; cursor:pointer; font-size:13px; padding:2px 5px; border-radius:3px; line-height:1; }
  .kq-instance .gb-icon:hover { background:rgba(255,255,255,0.15); }
  .kq-instance .gb-lang, .kq-instance .gb-datetime { font-size:12px; opacity:.95; }

  /* ---- xfce panel (desktop) ---- */
  .kq-instance .topbar { position:absolute; top:0; left:0; right:0; height:30px; display:none;
    align-items:center; justify-content:space-between; background:var(--panel-bg); z-index:1000; user-select:none; }
  .kq-instance .topbar.active { display:flex; }
  .kq-instance .tb-left, .kq-instance .tb-right { display:flex; align-items:center; height:100%; }
  .kq-instance .tb-icon { background:transparent; border:none; color:var(--panel-text); width:30px; height:100%;
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .kq-instance .tb-icon:hover, .kq-instance .tb-icon.open { background:var(--panel-hover); }
  .kq-instance .tb-icon.small { width:26px; color:#aab4bd; }
  .kq-instance .tb-sep { width:1px; height:16px; background:rgba(255,255,255,0.15); margin:0 4px; }
  .kq-instance .ws-switcher { display:flex; align-items:center; height:100%; }
  .kq-instance .ws-btn { background:none; border:none; color:var(--panel-text); font-size:11px; width:20px; height:20px;
    margin:0 1px; border-radius:2px; cursor:pointer; }
  .kq-instance .ws-btn.active { background:rgba(255,255,255,0.18); color:#fff; font-weight:700; }
  .kq-instance .ws-btn:hover { background:rgba(255,255,255,0.1); }
  .kq-instance .tb-right { padding-right:8px; }
  .kq-instance .clock { color:var(--panel-text); font-size:12px; margin-left:8px; }
  .kq-instance .tray-img { cursor:pointer; display:block; opacity:.95; }
  .kq-instance .tray-img:hover { opacity:1; }

  /* ---- whisker / applications menu ---- */
  .kq-instance .menu-dropdown { position:absolute; top:30px; left:4px; width:460px; max-height:480px; background:#1b1e22;
    border:1px solid #2c3339; border-radius:0 0 6px 6px; box-shadow:0 20px 50px rgba(0,0,0,0.5);
    display:none; z-index:1001; overflow:hidden; flex-direction:column; }

  function computeRect(def){
    var openIndex = Object.keys(winEls).length;
    var screenW = screenEl.clientWidth || 960, screenH = screenEl.clientHeight || 580;
    var baseX = Math.round((screenW - def.w) / 2);

    var offset = openIndex * 34;
    var x = Math.min(Math.max(0, baseX + offset), Math.max(0, screenW - def.w));
    var y = Math.min(Math.max(36, baseY + Math.round(offset * 0.6)), Math.max(36, screenH - def.h));

    var dragging=false, startX=0, startY=0, origX=0, origY=0;
    handleEl.addEventListener('pointerdown', function(e){
      if(e.target.closest('.win-ctrl')) return;
      dragging=true; startX=e.clientX; startY=e.clientY;
      origX=parseInt(el.style.left,10); origY=parseInt(el.style.top,10);
      handleEl.setPointerCapture(e.pointerId);
    });
    handleEl.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var nx = origX + (e.clientX-startX), ny = Math.max(0, origY + (e.clientY-startY));
      el.style.left = nx+'px'; el.style.top = ny+'px';
    });
    function endDrag(){ dragging=false; }
    handleEl.addEventListener('pointerup', endDrag);
    handleEl.addEventListener('pointercancel', endDrag);
  }

    function navigate(){
      var raw = urlInput.value.trim().toLowerCase();
      if(raw.indexOf('google') !== -1){ renderGoogle(); return; }
      if(raw.indexOf('networkwalks') !== -1){ renderNetworkwalks(); return; }
      if(ACTIVE_APP !== 'browser'){ appBlocked('Browser'); return; }
      // A future question where the browser IS the active app would render
      // its own fake target page here based on urlInput.value.
    }
    urlInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ navigate(); } });
    goBtn.addEventListener('click', navigate);
  }

  // ---- topbar / menu wiring ----
  var appsMenu = $('.kq-apps-menu');
  var appsBtn = $('.kq-apps-btn');
  function closeMenu(){ appsMenu.classList.remove('show'); appsBtn.classList.remove('open'); }
  appsBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var willShow = !appsMenu.classList.contains('show');
    closeMenu();
    if(willShow){ appsMenu.classList.add('show'); appsBtn.classList.add('open'); }
  });
  document.addEventListener('click', closeMenu);
  appsMenu.addEventListener('click', function(e){ e.stopPropagation(); });

  scope.querySelectorAll('.tb-icon[data-open]').forEach(function(b){
    b.addEventListener('click', function(){ openWindow(b.dataset.open); });
  });

  // ---- submit ----
  $('.kq-submit').addEventListener('click', function(){
    var sel = scope.querySelector('input[name="' + data.radioName + '"]:checked');
    var fb = $('.kq-fb');
    if(!sel){ fb.textContent = 'Please select an answer.'; fb.className = 'fb bad'; return; }
    var correctIndex = atob(data.correctB64);
    var options = scope.querySelectorAll('input[name="' + data.radioName + '"]');
    var chosenIndex = Array.prototype.indexOf.call(options, sel);
    var isCorrect = (String(chosenIndex) === String(correctIndex));
    fb.textContent = 'Answer submitted.' + (isCorrect ? ' (Correct - shown here only for this demo review)' : ' (Not correct - shown here only for this demo review)');
    fb.className = isCorrect ? 'fb ok' : 'fb bad';
    // In the real exam build this correctness note is hidden from the student -
    // only "Answer submitted." shows, and the score is tallied silently until the end.
  });
  }

  var roots = document.querySelectorAll('.kq-instance');
  roots.forEach(function(root, i){ initKaliQuestion(root, QUESTIONS[i]); });
})();
