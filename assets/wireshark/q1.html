<!DOCTYPE html>
<!-- wireshark_quiz_basic.html -->
<!-- v1.e - 2026-10-14 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireshark Quiz</title>
<style>
/* All rules are scoped under .wsq so they will not clash with the WordPress theme later. */
body{margin:0;background:#eef1f5;}
.wsq{--ink:#1f2937;--muted:#6b7280;--line:#d1d5db;--accent:#0b5cad;--ok:#15803d;--bad:#b91c1c;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);margin:0 auto;box-sizing:border-box;line-height:1.45;}
.wsq *{box-sizing:border-box;}
.wsq button{font-family:inherit;cursor:pointer;}

/* ---------- header banner ---------- */
.wsq{max-width:none;padding:0 0 28px;}
.wsq .hdr{display:flex;align-items:center;gap:16px;padding:10px 28px;background:linear-gradient(180deg,#2d3037 0%,#1f2227 100%);}
.wsq .hdr h1{margin:0;color:#fff;font-size:26px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;line-height:1.1;}
.wsq .hdr .hq{margin-left:auto;color:#fff;font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07);border-radius:20px;padding:5px 15px;}
.wsq .hbar{display:flex;gap:2px;height:5px;background:#1f2227;}
.wsq .hbar i{flex:1;background:#555a63;transition:background .3s;}
.wsq .hbar i.d{background:#c8102e;}
.wsq .hbar i.c{background:#ee4a60;}
.wsq .hdr img{height:46px;width:auto;display:block;}

/* ---------- page layout: question left, Wireshark right ---------- */
.wsq .layout{display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);grid-template-areas:". top" "card ws";
  gap:10px 24px;padding:16px 24px 0;align-items:start;max-width:1780px;margin:0 auto;}
.wsq .layout[hidden],.wsq .res[hidden]{display:none;}
.wsq .top{grid-area:top;}
.wsq .card{grid-area:card;align-self:stretch;display:flex;flex-direction:column;}
.wsq .wsarea{grid-area:ws;min-width:0;}
.wsq .tstrip{display:flex;align-items:center;justify-content:flex-end;min-height:34px;}
.wsq .top .msg.hint{margin-top:10px;}
.wsq .tbtns{display:flex;gap:8px;flex:none;}
.wsq .tbtns .btn{padding:7px 14px;font-size:13px;}

/* ---------- question card ---------- */
.wsq .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 24px 20px;box-shadow:0 2px 8px rgba(20,30,50,.07);}
.wsq .qnum{margin:0 0 4px;font-size:30px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#c0001a;line-height:1.1;}
.wsq .card h2{margin:0 0 10px;font-size:20px;font-weight:700;}
.wsq .scn{margin:0 0 12px;color:#374151;font-size:15px;}
.wsq .task{margin:0 0 6px;font-weight:700;font-size:16px;}
.wsq .fb{flex:1;min-height:14px;margin:6px 0 14px;display:flex;flex-direction:column;gap:8px;justify-content:flex-start;}
.wsq .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.wsq .opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:9px;padding:11px 14px;cursor:pointer;background:#fff;font-size:16px;transition:border-color .15s,background .15s;}
.wsq .opt:hover{border-color:var(--accent);background:#f4f9ff;}
.wsq .opt.on{border-color:var(--accent);background:#e8f2fd;box-shadow:inset 0 0 0 1px var(--accent);}
.wsq .opt.right{border-color:var(--ok);background:#ecfdf3;box-shadow:inset 0 0 0 1px var(--ok);}
.wsq .opt.locked{cursor:default;}
.wsq .opt input{accent-color:var(--accent);width:16px;height:16px;margin:0;}
.wsq .btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.wsq .btn{border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:9px 20px;font-size:14px;font-weight:600;transition:background .15s;}
.wsq .btn:hover{background:#094a8c;}
.wsq .btn:disabled{opacity:.5;cursor:default;}
.wsq .btn.ghost{background:#fff;color:var(--accent);}
.wsq .btn.ghost:hover:not(:disabled){background:#eef5fc;}
.wsq .btn.go{background:var(--ok);border-color:var(--ok);}
.wsq .btn.go:hover{background:#116a32;}
.wsq .msg{padding:10px 12px;border-radius:8px;font-size:14px;}
.wsq .msg.bad{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d;}
.wsq .msg.good{background:#ecfdf3;border:1px solid #bbf7d0;color:#14532d;}
.wsq .msg.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;}
.wsq .msg.hint{background:#fffbeb;border:1px solid #fde68a;color:#78350f;}
.wsq .msg code{font-family:Consolas,"Courier New",monospace;background:rgba(0,0,0,.07);padding:1px 5px;border-radius:3px;font-size:13px;}
.wsq .small{font-size:12px;color:var(--muted);margin:14px 0 0;}
.wsq .res .card{display:block;}
.wsq .small.brand{margin-top:4px;}
.wsq .small.brand a{color:#c0001a;font-weight:700;text-decoration:none;}
.wsq .small.brand a:hover{text-decoration:underline;}
.wsq .res{max-width:640px;margin:24px auto 0;padding:0 16px;}
.wsq .res .card{padding:26px 28px;}
.wsq .big{font-size:48px;font-weight:800;color:#c0001a;margin:4px 0;}

@media (max-width:980px){
  .wsq .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "card" "ws";padding:14px 12px 0;}
  .wsq .hdr{padding:10px 16px;flex-wrap:wrap;gap:6px 12px;}
  .wsq .hdr h1{font-size:19px;letter-spacing:1.5px;}
  .wsq .hdr .hq{order:3;margin-left:0;flex-basis:100%;border:0;background:none;padding:0;font-size:12px;opacity:.9;}
  .wsq .hdr img{height:36px;margin-left:auto;}
  .wsq .qnum{font-size:24px;}
}

/* ---------- Wireshark window (modelled on Wireshark 4.x for Windows) ---------- */
.wsq .scroller{overflow-x:auto;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.22);}
.wsq .ws{min-width:700px;background:#fff;border:1px solid #0078d7;border-radius:8px;overflow:hidden;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:12px;color:#000;position:relative;line-height:1.25;}
.wsq .ws svg{display:block;width:16px;height:16px;}
.wsq .ws button{font-family:inherit;}
.wsq .ws-title{background:#0078d7;color:#fff;height:31px;display:flex;align-items:center;padding-left:9px;gap:8px;font-size:12px;}
.wsq .ws-title .ico{display:flex;width:16px;height:16px;}
.wsq .ws-title .wc{margin-left:auto;display:flex;height:100%;}
.wsq .ws-title .wc i{width:46px;height:100%;display:flex;align-items:center;justify-content:center;}
.wsq .ws-title .wc svg{width:10px;height:10px;}
.wsq .ws-menu{display:flex;background:#fff;height:24px;padding:0 2px;align-items:center;}
.wsq .ws-menu button{border:0;background:transparent;padding:2px 7px;font-size:12px;color:#000;height:22px;}
.wsq .ws-menu button:hover{background:#e5f3ff;}
.wsq .ws-tb{display:flex;align-items:center;height:27px;padding:0 3px;background:#f0f0f0;gap:1px;border-top:1px solid #e3e3e3;}
.wsq .ws-tb button{width:24px;height:23px;border:1px solid transparent;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;border-radius:2px;cursor:pointer;}
.wsq .ws-tb button:hover:not(.dis){background:#dbe9f7;border-color:#9ec5ec;}
.wsq .ws-tb button.on{background:#cce4f7;border-color:#3d94e0;}
.wsq .ws-tb button.dis{opacity:.4;filter:grayscale(1);cursor:default;}
.wsq .ws-tb .sp{width:1px;height:18px;background:#bdbdbd;margin:0 4px;}
.wsq .ws-filter{display:flex;align-items:center;gap:6px;padding:2px 4px 3px 3px;background:#f0f0f0;position:relative;}
.wsq .fwrap{flex:1;display:flex;align-items:center;height:22px;background:#fff;border:1px solid #7a7a7a;border-radius:2px;position:relative;min-width:0;}
.wsq .fwrap:focus-within{border-color:#0078d7;box-shadow:0 0 0 1px #0078d7;}
.wsq .fwrap.ok{background:#afffaf;}
.wsq .fwrap.bad{background:#ffafaf;}
.wsq .fwrap .bm{width:16px;height:16px;margin:0 3px 0 1px;flex:none;}
.wsq .fwrap input{flex:1;min-width:0;height:20px;border:0;background:transparent;outline:none;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:12px;padding:0 3px;color:#000;}
.wsq .fwrap input::placeholder{color:#7d7d7d;}
.wsq .fwrap .clr{display:none;width:18px;text-align:center;color:#666;cursor:pointer;font-size:11px;}
.wsq .fwrap.has .clr{display:block;}
.wsq .fwrap .go{width:26px;height:18px;margin-right:4px;border:0;border-radius:3px;background:#8db4e6;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:none;}
.wsq .fwrap .go:hover{background:#6ea3df;}
.wsq .fwrap .dd{width:16px;text-align:center;color:#555;font-size:9px;flex:none;}
.wsq .ws-filter .plus{font-size:16px;color:#333;width:12px;text-align:center;}
.wsq .sugg{position:absolute;left:0;top:23px;z-index:20;background:#fff;border:1px solid #7a7a7a;box-shadow:0 4px 10px rgba(0,0,0,.25);min-width:260px;max-height:200px;overflow:auto;display:none;}
.wsq .sugg div{padding:2px 8px;font-family:Consolas,"Courier New",monospace;font-size:12.5px;cursor:pointer;}
.wsq .sugg div.on,.wsq .sugg div:hover{background:#0078d7;color:#fff;}
.wsq .ferr{display:none;padding:2px 10px;background:#fff1f1;color:#8a1111;border-top:1px solid #f0b4b4;font-size:12px;}
.wsq .ws-body{height:534px;background:#fff;border-top:1px solid #c9c9c9;overflow:hidden;}

/* welcome screen */
.wsq .ws-wel{padding:24px 0 0 36px;height:100%;}
.wsq .ws-wel .banner{display:inline-block;background:#8db4e8;border-radius:8px;padding:5px 9px;font-size:12px;color:#111;}
.wsq .ws-wel h3{margin:16px 0 6px 18px;font-size:20px;font-weight:700;color:#7d7d7d;}
.wsq .ws-wel .cf{display:flex;align-items:center;gap:6px;margin:0 36px 8px 18px;font-size:12px;}
.wsq .ws-wel .cfin{flex:1;display:flex;align-items:center;height:20px;border:1px solid #7a7a7a;border-radius:2px;background:#fff;max-width:600px;}
.wsq .ws-wel .cfin .bm{width:16px;height:16px;margin:0 3px 0 1px;}
.wsq .ws-wel .cfin input{flex:1;min-width:0;border:0;outline:none;font-family:inherit;font-size:12px;height:18px;background:transparent;}
.wsq .ws-wel .cfin .dd{width:16px;text-align:center;color:#555;font-size:9px;}
.wsq .ws-wel .allif{height:21px;border:1px solid #adadad;background:#f4f4f4;border-radius:3px;font-size:12px;padding:0 6px;}
.wsq .ifl{margin:0 36px 0 18px;max-width:820px;}
.wsq .if{display:flex;align-items:center;height:19px;padding-left:37px;border:1px solid transparent;cursor:default;font-size:12px;}
.wsq .if .nm{width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wsq .if svg.sp{width:62px;height:16px;}
.wsq .if.sel{background:#cce8ff;border-color:#0078d7;}
.wsq .if.hint:not(.sel){background:#fff3bf;border-color:#f2b600;animation:wsq-pulse 1.8s ease-in-out infinite;}
.wsq .if .tag{margin-left:14px;display:inline-flex;align-items:center;gap:6px;background:#f2b600;color:#3b2800;font-weight:700;font-size:12px;padding:1px 9px 1px 6px;border-radius:10px;white-space:nowrap;animation:wsq-nudge 1s ease-in-out infinite;}
.wsq .if .tag svg{width:14px;height:14px;}
@keyframes wsq-nudge{0%,100%{transform:translateX(0);}50%{transform:translateX(-6px);}}
@media (prefers-reduced-motion:reduce){.wsq .if.hint:not(.sel),.wsq .if .tag{animation:none;}}

/* capture view */
.wsq .ws-list{height:260px;overflow:auto;background:#fff;outline:none;}
.wsq .ws-list table{border-collapse:collapse;width:100%;min-width:700px;table-layout:fixed;font-size:13px;}
.wsq .ws-list th{position:sticky;top:0;z-index:2;background:#fff;text-align:left;font-weight:400;padding:3px 4px;height:26px;border-right:1px solid #e1e1e1;border-bottom:1px solid #cfcfcf;white-space:nowrap;}
.wsq .ws-list td{padding:0 4px;height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;}
.wsq .ws-list td.r{text-align:right;padding-right:8px;}
.wsq .ws-list tr.sel td{background:#0078d7 !important;color:#fff !important;}
.wsq .spl{height:5px;background:#f0f0f0;border-top:1px solid #c9c9c9;border-bottom:1px solid #c9c9c9;}
.wsq .ws-det{height:170px;overflow:auto;background:#fff;font-family:Consolas,"Courier New",monospace;font-size:13px;}
.wsq .tn{white-space:pre;cursor:default;height:20px;line-height:20px;display:flex;align-items:center;}
.wsq .tn.t0{background:#ececec;}
.wsq .tn:hover:not(.sel){background:#e5f1fb;}
.wsq .tn.sel{background:#0078d7 !important;color:#fff;}
.wsq .tg{display:inline-block;width:16px;height:16px;flex:none;position:relative;}
.wsq .tg.c::before{content:"";position:absolute;left:4px;top:5px;width:5px;height:5px;border-right:1.5px solid #6b6b6b;border-top:1.5px solid #6b6b6b;transform:rotate(45deg);}
.wsq .tg.c.o::before{left:3px;top:3px;transform:rotate(135deg);}
.wsq .tn.sel .tg.c::before{border-color:#fff;}
.wsq .ws-hex{height:94px;overflow:auto;background:#fff;display:flex;font-family:Consolas,"Courier New",monospace;font-size:13px;line-height:18px;}
.wsq .ws-hex .gut{background:#f0f0f0;color:#808080;padding:2px 6px 2px 4px;white-space:pre;min-height:100%;}
.wsq .ws-hex .hx,.wsq .ws-hex .as{padding:2px 0 2px 10px;white-space:pre;}
.wsq .ws-hex .as{margin-left:18px;}
.wsq .hl{background:#0078d7;color:#fff;}
.wsq .ws-status{display:flex;align-items:center;height:24px;background:#f0f0f0;border-top:1px solid #d6d6d6;font-size:12px;}
.wsq .ws-status .si{display:flex;align-items:center;gap:6px;padding:0 8px 0 6px;}
.wsq .ws-status .si svg{width:14px;height:14px;}
.wsq .ws-status .rd{width:13px;height:13px;border-radius:50%;background:#d9261c;border:1px solid #9b1b14;}
.wsq .ws-status .sl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px;}
.wsq .ws-status .sg{padding:0 12px;white-space:nowrap;border-left:2px dotted #b5b5b5;height:18px;line-height:18px;}
.wsq .ctx{position:fixed;z-index:1000;background:#fff;border:1px solid #8a8f98;box-shadow:0 4px 12px rgba(0,0,0,.25);font-size:13px;min-width:200px;padding:3px 0;}
.wsq .ctx div{padding:4px 14px;cursor:pointer;}
.wsq .ctx div:hover{background:#0078d7;color:#fff;}
.wsq .toast{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:#323a45;color:#fff;padding:6px 14px;border-radius:6px;font-size:12.5px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;}
.wsq .toast.on{opacity:1;}
.wsq .ws-wel .callout{display:flex;align-items:center;gap:12px;margin:14px 36px 0 18px;max-width:640px;padding:10px 16px;background:#fff3bf;border:2px solid #f2b600;border-radius:10px;color:#4a3200;animation:wsq-pulse 1.8s ease-in-out infinite;}
.wsq .ws-wel .callout b{display:block;font-size:19px;line-height:1.2;}
.wsq .ws-wel .callout span{display:block;font-size:12.5px;margin-top:2px;}
.wsq .ws-wel .callout svg{width:30px;height:30px;flex:none;}
@keyframes wsq-pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,182,0,.55);}50%{box-shadow:0 0 0 7px rgba(242,182,0,0);}}
@media (prefers-reduced-motion:reduce){.wsq .ws-wel .callout{animation:none;}}

/* ---------- Stage 2: menus, dialogs, answer-selection box ---------- */
.wsq .ws-menu{position:relative;}
.wsq .ws-menu button.open{background:#cce8ff;}
.wsq .mdd{position:absolute;z-index:60;background:#fff;border:1px solid #a8a8a8;box-shadow:2px 3px 9px rgba(0,0,0,.28);min-width:210px;padding:2px 0;font-size:12px;color:#000;line-height:1.2;}
.wsq .mdd hr{margin:3px 1px;border:0;border-top:1px solid #d9d9d9;}
.wsq .mdd .mi{position:relative;padding:3px 26px 3px 24px;white-space:nowrap;cursor:default;}
.wsq .mdd .mi:hover{background:#cce8ff;}
.wsq .mdd .mi .ar{position:absolute;right:8px;font-weight:400;font-size:10px;}
.wsq .mdd .mi.sub>.mdd2{display:none;position:absolute;left:100%;top:-3px;min-width:200px;}
.wsq .mdd .mi.sub:hover>.mdd2{display:block;}
.wsq .ctxm{position:fixed;z-index:1000;}
.wsq .ctxm.flip .mdd2{left:auto;right:100%;}

.wsq .dlg{position:absolute;left:2.5%;top:60px;width:95%;height:490px;background:#f0f0f0;border:1px solid #0078d7;box-shadow:0 8px 28px rgba(0,0,0,.38);z-index:45;display:flex;flex-direction:column;font-size:12px;color:#000;}
.wsq .dlg .dt{height:28px;flex:none;background:#fff;display:flex;align-items:center;gap:8px;padding-left:8px;border-bottom:1px solid #dcdcdc;}
.wsq .dlg .dt .di svg{width:14px;height:14px;display:block;}
.wsq .dlg .dt .x{margin-left:auto;width:44px;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;}
.wsq .dlg .dt .x:hover{background:#e81123;color:#fff;}
.wsq .dlg .db{flex:1;min-height:0;overflow:auto;background:#fff;margin:6px 8px 0;border:1px solid #adadad;}
.wsq .dlg .df{flex:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;}
.wsq .dlg .gap{flex:1;}
.wsq .dlg .brk{flex-basis:100%;height:0;}
.wsq .dlg .dbtn{min-width:72px;height:23px;border:1px solid #adadad;background:#e1e1e1;font-size:12px;padding:0 10px;cursor:pointer;}
.wsq .dlg .dbtn:hover{background:#e5f1fb;border-color:#0078d7;}
.wsq .dlg .chk{display:flex;align-items:center;gap:4px;color:#444;}
.wsq .dlg .fst{color:#222;}
.wsq .dtab{border-collapse:collapse;width:100%;font-size:12px;}
.wsq .dtab th{position:sticky;top:0;z-index:2;background:#fff;text-align:left;font-weight:400;padding:3px 8px;border-bottom:1px solid #cfcfcf;border-right:1px solid #e3e3e3;white-space:nowrap;}
.wsq .dtab th.srt{cursor:pointer;}
.wsq .dtab th.srt:hover{background:#e5f1fb;}
.wsq .dtab td{padding:2px 8px;white-space:nowrap;border-bottom:1px solid #f0f0f0;}
.wsq .dtab .r{text-align:right;}
.wsq .dtab tr.prow{cursor:pointer;}
.wsq .dtab tr.prow:hover td{background:#cce8ff;}
.wsq .dtab .tg{margin-right:4px;vertical-align:middle;cursor:pointer;}
.wsq .tabs{display:flex;gap:2px;background:#f0f0f0;padding:4px 4px 0;border-bottom:1px solid #adadad;position:sticky;top:0;z-index:3;}
.wsq .tab{padding:3px 12px;border:1px solid #adadad;border-bottom:0;background:#e9e9e9;cursor:pointer;}
.wsq .tab.on{background:#fff;font-weight:600;margin-bottom:-1px;}
.wsq .dtab thead th{top:25px;}
.wsq .sevrow td{background:#f6f6f6;font-weight:600;}
.wsq .sv{padding:0 6px;border-radius:2px;}
.wsq .sv-Error{background:#ff9d9d;}
.wsq .sv-Warning{background:#fff1a8;}
.wsq .sv-Note{background:#a0e9ff;}
.wsq .sv-Chat{background:#c9d8ff;}
.wsq .fol{margin:0;padding:6px 8px;font-family:Consolas,"Courier New",monospace;font-size:13px;white-space:pre-wrap;word-break:break-all;}
.wsq .fol .fc{color:#b30000;background:#fff0f0;}
.wsq .fol .fs{color:#00007a;background:#eef0ff;}

.wsq .selbox{display:flex;align-items:center;gap:10px;border:1.5px dashed #9aa7b8;background:#f6f9fd;border-radius:9px;padding:11px 14px;margin-bottom:16px;font-size:14px;}
.wsq .selbox .sl-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);white-space:nowrap;}
.wsq .selbox .sl-v{font-weight:600;word-break:break-word;}

/* ---------- exam mode (v3): hint popover, results review ---------- */
.wsq .hdr h1 .lvl{font-size:14px;font-weight:600;letter-spacing:1px;margin-left:8px;opacity:.9;white-space:nowrap;}
.wsq .tstrip{position:relative;}

Cap.prototype.icmp = function (t, s, d, type, ident, seq, other) {

  var kids = [
    N('Type: ' + type + (req ? ' (Echo (ping) request)' : ' (Echo (ping) reply)'), 'icmp.type', 34, 1, null, String(type)),
    N('Code: 0', 'icmp.code', 35, 1, null, '0'),
    N('Checksum: 0x' + hex4(cs) + ' [correct]', 'icmp.checksum', 36, 2, null, '0x' + hex4(cs)),
    N('Identifier (BE): ' + ident + ' (0x' + hex4(ident) + ')', 'icmp.ident', 38, 2, null, String(ident)),
    N('Sequence Number (BE): ' + seq + ' (0x' + hex4(seq) + ')', 'icmp.seq', 40, 2, null, String(seq)),
    N('Data (32 bytes)', null, 42, 32)

  var icn = N('Internet Control Message Protocol', 'icmp', 34, l4.length, kids);
  var p = this.ip({ t: t, s: s, d: d, proto: 1, l4: l4, layers: ['icmp'], col: 'ICMP',
    info: info + (req ? ' (no response found!)' : ' (request in ' + other.no + ')'), f: f, nodes: [icn] });

};

            '</td><td class="r">' + (n.by / by * 100).toFixed(1) + '</td><td class="r">' + n.by + '</td><td class="r">' + fmtBps(n.by * 8 / H.dur) +

    n.kids.forEach(function (k) { walk(k, depth + 1); });
  })(H.root, 0);

  tabs.forEach(function (t) {
    h += '<span class="tab' + (D.tab === t[0] ? ' on' : '') + '" data-d="tab" data-k="' + t[0] + '">' + t[1] + ' · ' + (t[0] === 'ipv6' ? 0 : C[t[0]].length) + '</span>';
  });
  h += '</div>';

    else if (e.key === 'ArrowUp' && open) { e.preventDefault(); W.suggIdx = (W.suggIdx - 1 + W.sugg.length) % W.sugg.length; markSugg(); }
    else if (e.key === 'Tab' && open) { e.preventDefault(); pickSugg(W.suggIdx >= 0 ? W.suggIdx : 0); }
    else if (e.key === 'Enter') { e.preventDefault(); if (open && W.suggIdx >= 0) pickSugg(W.suggIdx); else applyFilter(); }
    else if (e.key === 'Escape') hideSugg();
    return;
  }
  if (e.target.id === 'ws-list' && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && W.shown.length) {
    e.preventDefault();
    var idx = -1; for (var i = 0; i < W.shown.length; i++) if (W.shown[i].no === W.sel) idx = i;
    idx = e.key === 'ArrowDown' ? Math.min(W.shown.length - 1, idx + 1) : Math.max(0, idx - 1);
    selectPacket(W.shown[idx].no);
    var row = document.querySelector('#ws-list tr[data-no="' + W.shown[idx].no + '"]'); if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
  }
});
wsMount.addEventListener('click', function (e) {
  var t = e.target;
  var mi_ = t.closest('.mdd .mi');
  if (mi_) {
    if (mi_.className.indexOf('sub') >= 0) return;
    var act = mi_.getAttribute('data-ma'); closeCtx(); closeMenu(); runAction(act); return;
  }
  closeCtx();
  if (t.closest('.dlg')) { dlgClick(t); return; }
  var mb = t.closest('[data-menu]');
  if (mb) { var nm = mb.getAttribute('data-menu'); if (W.menu === nm) closeMenu(); else openMenu(nm, mb); return; }
  closeMenu();
  if (t.closest('#ws-sugg div')) { pickSugg(Number(t.closest('#ws-sugg div').getAttribute('data-i'))); return; }
  if (t.closest('#ws-apply')) { applyFilter(); return; }
  if (t.closest('#ws-clear')) { var inp = document.getElementById('ws-f'); inp.value = ''; applyFilter(); inp.focus(); return; }
  if (t.closest('.rd')) { runAction('analyze.expert'); return; }
  var tb = t.closest('[data-tb]');
  if (tb) {
    if (tb.className.indexOf('dis') >= 0) return;
    if (tb.getAttribute('data-tb') === 'fin' && W.mode === 'welcome') tryStart(W.iface);
    else toast('Not allowed');
    return;
  }
  var ifr = t.closest('.if');
  if (ifr) { W.iface = Number(ifr.getAttribute('data-i')); markIfaces(); return; }
  var tr = t.closest('#ws-list tr[data-no]');
  if (tr) { selectPacket(Number(tr.getAttribute('data-no'))); document.getElementById('ws-list').focus(); return; }
  var tn = t.closest('#ws-det .tn');
  if (tn) {
    var path = tn.getAttribute('data-path'), p = pktByNo(W.sel), n = nodeAt(p.tree, path);
    W.selPath = path;
    if (n && n.kids && n.kids.length) W.exp[path] = !W.exp[path];
    drawDetails(); drawHex(); drawStatus();
  }
});
wsMount.addEventListener('mouseover', function (e) {
  if (!W || !W.menu) return;
  var mb = e.target.closest ? e.target.closest('[data-menu]') : null;
  if (mb && mb.getAttribute('data-menu') !== W.menu) openMenu(mb.getAttribute('data-menu'), mb);
});
wsMount.addEventListener('dblclick', function (e) {
  var ifr = e.target.closest ? e.target.closest('.if') : null;
  if (ifr && W.mode === 'welcome') { W.iface = Number(ifr.getAttribute('data-i')); markIfaces(); tryStart(W.iface); }
});
wsMount.addEventListener('contextmenu', function (e) {
  var tn = e.target.closest ? e.target.closest('#ws-det .tn') : null;
  var trc = e.target.closest ? e.target.closest('#ws-list tr[data-no]') : null;
  if (trc) {
    e.preventDefault(); closeCtx(); closeMenu();
    selectPacket(Number(trc.getAttribute('data-no')));
    showPktMenu(e.clientX, e.clientY);
    return;
  }
  if (!tn) return;
  e.preventDefault(); closeCtx(); closeMenu();
  var path = tn.getAttribute('data-path'), p = pktByNo(W.sel), n = nodeAt(p.tree, path);
  W.selPath = path; drawDetails(); drawHex(); drawStatus();
  if (!n || !n.f) { toast('This item cannot be used as a filter.'); return; }
  var sel = n.v !== undefined ? n.f + ' == ' + n.v : n.f;
  var items = [['Apply as Filter → Selected', sel, true], ['Apply as Filter → Not Selected', '!(' + sel + ')', true],
               ['Prepare as Filter → Selected', sel, false], ['Prepare as Filter → Not Selected', '!(' + sel + ')', false]];
  var m = document.createElement('div'); m.className = 'ctx';
  m.style.left = Math.min(e.clientX, window.innerWidth - 230) + 'px'; m.style.top = Math.min(e.clientY, window.innerHeight - 130) + 'px';
  items.forEach(function (it) {
    var d = document.createElement('div'); d.textContent = it[0];
    d.addEventListener('click', function (ev) {
      ev.stopPropagation(); closeCtx();
      document.getElementById('ws-f').value = it[1]; checkInput();
      if (it[2]) applyFilter();
    });
    m.appendChild(d);
  });
  root.appendChild(m);
});
document.addEventListener('click', function (e) {
  if (!e.target.closest || !e.target.closest('.ctx, .ctxm, .mdd, [data-menu]')) { closeCtx(); closeMenu(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && W) { closeCtx(); closeMenu(); if (W.dlg) closeDialog(); }
});

/* ---------- start ---------- */
buildWireshark();
renderQuiz();

})();
</script>
